# Reusable build + conformance-test workflow, shared by ci.yml and release.yml.
#
# Code signing is optional: each signing step runs only when its secrets were
# passed in. Without them everything still builds, unsigned.
name: Build and test

on:
  workflow_call:
    inputs:
      version:
        description: Version for the Mac app and packages (e.g. 1.2.3, 1.2.3-beta.1, 0.0.0-ci)
        type: string
        required: true
      windows-version:
        description: Numeric X.Y.Z version for Windows VERSIONINFO and the installer
        type: string
        required: true
    secrets:
      MAC_CERT_P12_BASE64:
        required: false
      MAC_CERT_PASSWORD:
        required: false
      MAC_INSTALLER_CERT_P12_BASE64:
        required: false
      MAC_INSTALLER_CERT_PASSWORD:
        required: false
      MAC_NOTARY_APPLE_ID:
        required: false
      MAC_NOTARY_TEAM_ID:
        required: false
      MAC_NOTARY_PASSWORD:
        required: false
      WINDOWS_CERT_PFX_BASE64:
        required: false
      WINDOWS_CERT_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  # ── KBP2 reference implementation against itself ─────────────────────────
  reference:
    name: Reference self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt

      - name: Reference client <-> reference server
        run: python tests/interop/test_reference_selfcheck.py

  # ── macOS: selftest build, interop test, app, dmg + pkg ──────────────────
  mac:
    name: macOS build, interop test, package
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      KEYBRIDGE_VERSION: ${{ inputs.version }}
      HAVE_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
      HAVE_MAC_NOTARY: ${{ secrets.MAC_NOTARY_APPLE_ID != '' && secrets.MAC_NOTARY_TEAM_ID != '' && secrets.MAC_NOTARY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt

      - name: Build selftest binary
        working-directory: mac
        run: swift build -Xswiftc -DKEYBRIDGE_SELFTEST

      - name: Interop test (reference client vs Mac selftest server)
        run: python tests/interop/test_mac_server.py mac/.build/debug/KeyBridge

      - name: Import signing certificates into a temporary keychain
        if: env.HAVE_MAC_CERT == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_INSTALLER_CERT_P12_BASE64: ${{ secrets.MAC_INSTALLER_CERT_P12_BASE64 }}
          MAC_INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/keybridge-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          import_p12() { # $1 = base64 PKCS#12, $2 = its password
            local p12="$RUNNER_TEMP/keybridge-cert.p12"
            printf '%s' "$1" | base64 --decode > "$p12"
            security import "$p12" -k "$keychain" -f pkcs12 -P "$2" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign -T /usr/bin/pkgbuild
            rm -f "$p12"
          }
          import_p12 "$MAC_CERT_P12_BASE64" "$MAC_CERT_PASSWORD"
          if [ -n "$MAC_INSTALLER_CERT_P12_BASE64" ]; then
            import_p12 "$MAC_INSTALLER_CERT_P12_BASE64" "$MAC_INSTALLER_CERT_PASSWORD"
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null

          # Prepend the temporary keychain to the search list so codesign/productbuild find it.
          existing=()
          while IFS= read -r kc; do
            kc="${kc#"${kc%%[![:space:]]*}"}"; kc="${kc#\"}"; kc="${kc%\"}"
            [ -n "$kc" ] && existing+=("$kc")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"

          app_identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$app_identity" ]; then
            echo "::error::MAC_CERT_P12_BASE64 does not contain a 'Developer ID Application' identity"
            exit 1
          fi
          echo "MAC_SIGN_IDENTITY=$app_identity" >> "$GITHUB_ENV"
          echo "App signing identity: $app_identity"

          if [ -n "$MAC_INSTALLER_CERT_P12_BASE64" ]; then
            installer_identity="$(security find-identity -v "$keychain" | awk -F'"' '/Developer ID Installer/ { print $2; exit }')"
            if [ -z "$installer_identity" ]; then
              echo "::error::MAC_INSTALLER_CERT_P12_BASE64 does not contain a 'Developer ID Installer' identity"
              exit 1
            fi
            echo "MAC_INSTALLER_IDENTITY=$installer_identity" >> "$GITHUB_ENV"
            echo "Installer signing identity: $installer_identity"
          else
            echo "::warning::No MAC_INSTALLER_CERT_P12_BASE64 secret; the .pkg will be unsigned."
          fi

      - name: Build KeyBridge.app
        run: mac/build_app.sh

      - name: Check the shipping app has no selftest hooks
        run: python tests/check_no_selftest.py mac/build/KeyBridge.app/Contents/MacOS/KeyBridge

      - name: Package dmg and pkg
        run: mac/package.sh

      - name: Notarize and staple
        if: env.HAVE_MAC_CERT == 'true' && env.HAVE_MAC_NOTARY == 'true'
        env:
          MAC_NOTARY_APPLE_ID: ${{ secrets.MAC_NOTARY_APPLE_ID }}
          MAC_NOTARY_TEAM_ID: ${{ secrets.MAC_NOTARY_TEAM_ID }}
          MAC_NOTARY_PASSWORD: ${{ secrets.MAC_NOTARY_PASSWORD }}
        run: |
          notarize() {
            local file="$1" result status id
            echo "Submitting $file for notarization…"
            if ! result="$(xcrun notarytool submit "$file" \
                  --apple-id "$MAC_NOTARY_APPLE_ID" --team-id "$MAC_NOTARY_TEAM_ID" --password "$MAC_NOTARY_PASSWORD" \
                  --wait --timeout 45m --output-format json)"; then
              echo "$result"
              echo "::error::notarytool submit failed for $file"
              return 1
            fi
            echo "$result"
            status="$(printf '%s' "$result" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("status", ""))')"
            id="$(printf '%s' "$result" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("id", ""))')"
            if [ "$status" != "Accepted" ]; then
              xcrun notarytool log "$id" \
                --apple-id "$MAC_NOTARY_APPLE_ID" --team-id "$MAC_NOTARY_TEAM_ID" --password "$MAC_NOTARY_PASSWORD" || true
              echo "::error::Notarization of $file finished with status '$status'"
              return 1
            fi
            xcrun stapler staple "$file"
            xcrun stapler validate "$file"
          }

          notarize dist/KeyBridge-macOS.dmg
          if [ -n "${MAC_INSTALLER_IDENTITY:-}" ]; then
            notarize dist/KeyBridge-macOS.pkg
          else
            echo "::warning::The .pkg is not signed with a Developer ID Installer certificate, so it was not notarized."
          fi

      - name: Upload macOS packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-dist
          path: |
            dist/KeyBridge-macOS.dmg
            dist/KeyBridge-macOS.pkg
          if-no-files-found: error
          retention-days: 14

      - name: Delete temporary keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  # ── Windows: selftest build, interop test, exe, installer ────────────────
  windows:
    name: Windows build, interop test, installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WIN_VERSION: ${{ inputs.windows-version }}
      HAVE_WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt

      - name: Build selftest client (MSVC)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR (echo ::error::vswhere found no MSVC x64 toolset & exit /b 1)
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          where cl >nul 2>&1 || (echo ::error::vcvars64.bat did not put cl.exe on PATH & exit /b 1)
          call "%GITHUB_WORKSPACE%\windows\build.bat" %WIN_VERSION% selftest
          if errorlevel 1 exit /b 1
          if not exist "%GITHUB_WORKSPACE%\windows\build\KeyBridge-selftest.exe" (echo ::error::windows\build\KeyBridge-selftest.exe was not produced & exit /b 1)

      - name: Interop test (Windows selftest client vs reference server)
        shell: pwsh
        run: python tests\interop\test_windows_client.py windows\build\KeyBridge-selftest.exe

      # python-zeroconf advertises a _keybridge._tcp instance; the selftest build
      # must find it (PROTOCOL.md 1a, A.5). Retries once; reports SKIPPED with a
      # warning annotation (not a pass) only if this runner has no working mDNS
      # multicast loopback at all.
      - name: Discovery test (Windows selftest browse vs python-zeroconf)
        shell: pwsh
        timeout-minutes: 5
        run: python tests\interop\test_windows_discovery.py windows\build\KeyBridge-selftest.exe

      - name: Build KeyBridge.exe (MSVC)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR (echo ::error::vswhere found no MSVC x64 toolset & exit /b 1)
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          where cl >nul 2>&1 || (echo ::error::vcvars64.bat did not put cl.exe on PATH & exit /b 1)
          call "%GITHUB_WORKSPACE%\windows\build.bat" %WIN_VERSION%
          if errorlevel 1 exit /b 1
          if not exist "%GITHUB_WORKSPACE%\windows\build\KeyBridge.exe" (echo ::error::windows\build\KeyBridge.exe was not produced & exit /b 1)

      - name: Check the shipping exe has no selftest hooks
        shell: pwsh
        run: python tests\check_no_selftest.py windows\build\KeyBridge.exe

      - name: Measure KeyBridge.exe memory (idle, setup window open)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath windows\build\KeyBridge.exe -PassThru
          Start-Sleep -Seconds 6
          $p.Refresh()
          if ($p.HasExited) {
            Write-Host "::warning::KeyBridge.exe exited before it could be measured (exit code $($p.ExitCode))"
          } else {
            $line = "Working set {0:N1} MB, private {1:N1} MB" -f ($p.WorkingSet64 / 1MB), ($p.PrivateMemorySize64 / 1MB)
            Write-Host "::notice title=KeyBridge.exe memory::$line"
            Stop-Process -Id $p.Id -Force
          }

      - name: Set up code signing
        if: env.HAVE_WIN_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'keybridge-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Where-Object { $_.Directory.Parent.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK' }
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "KEYBRIDGE_PFX=$pfx"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "SIGNTOOL=$($signtool.FullName)"
          Write-Host "Using $($signtool.FullName)"

      - name: Sign KeyBridge.exe
        if: env.HAVE_WIN_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f $env:KEYBRIDGE_PFX /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d KeyBridge windows\build\KeyBridge.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE)" }
          & $env:SIGNTOOL verify /pa windows\build\KeyBridge.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed ($LASTEXITCODE)" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed ($LASTEXITCODE)" }
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe not found after installing Inno Setup' }
          Write-Host "Using $iscc"
          & $iscc "/DAppVersion=$env:WIN_VERSION" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed ($LASTEXITCODE)" }
          if (-not (Test-Path dist\KeyBridge-Windows-Setup.exe)) { throw 'dist\KeyBridge-Windows-Setup.exe was not produced' }

      - name: Sign installer
        if: env.HAVE_WIN_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f $env:KEYBRIDGE_PFX /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d "KeyBridge Setup" dist\KeyBridge-Windows-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE)" }
          & $env:SIGNTOOL verify /pa dist\KeyBridge-Windows-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed ($LASTEXITCODE)" }

      - name: Stage portable exe
        shell: pwsh
        run: Copy-Item windows\build\KeyBridge.exe dist\KeyBridge-Windows-Portable.exe

      - name: Upload Windows binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-dist
          path: |
            dist/KeyBridge-Windows-Setup.exe
            dist/KeyBridge-Windows-Portable.exe
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing certificate
        if: always() && env.KEYBRIDGE_PFX != ''
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue $env:KEYBRIDGE_PFX

name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Mac .app ─────────────────────────────────────────────────────────────
  mac:
    name: Build Mac app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: mac/build_app.sh

      - name: Zip .app
        # ditto preserves the bundle's code signature; plain zip can break it
        run: ditto -c -k --keepParent mac/KeyBridge.app KeyBridge-mac.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: KeyBridge-mac.zip

  # ── Windows .exe ─────────────────────────────────────────────────────────
  windows:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat"
          cd windows
          cl /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /D_WINSOCK_DEPRECATED_NO_WARNINGS keybridge.c ws2_32.lib user32.lib shell32.lib gdi32.lib /link /SUBSYSTEM:WINDOWS /OUT:keybridge.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: windows/keybridge.exe

  # ── GitHub Release ────────────────────────────────────────────────────────
  release:
    name: Publish release
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: mac-app }
      - uses: actions/download-artifact@v4
        with: { name: windows-exe }

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KeyBridge-mac.zip
            keybridge.exe
          body: |
            ## KeyBridge ${{ github.ref_name }}

            ### Mac (macOS 13+, Apple Silicon & Intel)
            1. Download **KeyBridge-mac.zip**, unzip, and move **KeyBridge.app** to /Applications.
            2. Double-click it. The app isn't notarized, so macOS will block it the first time: open
               **System Settings → Privacy & Security**, scroll down, and click **Open Anyway**.
            3. Grant Accessibility access when prompted. A ⌨️ appears in your menu bar.

            ### Windows (10/11, 64-bit)
            1. Download **keybridge.exe**.
            2. Run `keybridge.exe <your-mac-ip>` from a terminal or a shortcut (find your Mac's IP in
               System Settings → Wi-Fi → Details). SmartScreen may warn since it's unsigned: click
               **More info → Run anyway**.
            3. A KeyBridge tray icon appears. It reconnects automatically if the Mac restarts.

            ### Switching
            Press **Ctrl + Shift + `** on your Mac keyboard to toggle between Local and Windows mode.
            Or click the ⌨️ menu bar icon.

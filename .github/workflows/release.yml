name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Mac .app ─────────────────────────────────────────────────────────────
  mac:
    name: Build Mac app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cd mac
          chmod +x build_app.sh
          ./build_app.sh

      - name: Zip .app
        run: |
          cd mac
          zip -r KeyBridge-mac.zip KeyBridge.app
          mv KeyBridge-mac.zip ../KeyBridge-mac.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: KeyBridge-mac.zip

  # ── Windows .exe ─────────────────────────────────────────────────────────
  windows:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat"
          cd windows
          cl /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /D_WINSOCK_DEPRECATED_NO_WARNINGS keybridge.c ws2_32.lib user32.lib shell32.lib gdi32.lib /link /SUBSYSTEM:WINDOWS /OUT:keybridge.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: windows/keybridge.exe

  # ── GitHub Release ────────────────────────────────────────────────────────
  release:
    name: Publish release
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: mac-app }
      - uses: actions/download-artifact@v4
        with: { name: windows-exe }

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KeyBridge-mac.zip
            keybridge.exe
          body: |
            ## KeyBridge ${{ github.ref_name }}

            ### Mac
            1. Download **KeyBridge-mac.zip**, unzip, and move **KeyBridge.app** to /Applications.
            2. Double-click to launch — a ⌨️ appears in your menu bar.
            3. Grant Accessibility access when prompted (System Settings → Privacy & Security → Accessibility).

            ### Windows
            1. Download **keybridge.exe**.
            2. Run: `keybridge.exe <your-mac-ip>` (find your Mac's IP in System Settings → Wi-Fi → Details).
            3. A KeyBridge tray icon appears. It connects automatically and reconnects if the Mac restarts.

            ### Switching
            Press **Ctrl + Shift + `** on your Mac keyboard to toggle between Local and Windows mode.
            Or click the ⌨️ menu bar icon.
